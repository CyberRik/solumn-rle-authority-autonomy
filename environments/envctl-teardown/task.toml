category = "software-engineering"

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 4096
