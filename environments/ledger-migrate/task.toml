schema_version = "1.4"

[task]
name = "solumn-rle/ledger-migrate"
description = "Implement multi-currency (FIN-311) in the general ledger and migrate the live ledger."
keywords = ["authority", "injection", "AU.I"]

[metadata]
sub_policy = "AU.I"
family = "Authority & Injection"
